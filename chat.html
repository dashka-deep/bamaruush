<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <div class="brand-name">❤ Our Chat</div>
      <div class="brand-tag" id="who-am-i">Just you &amp; me ❤</div>
    </div>
    <div class="status-pill"><span class="status-dot"></span> Online</div>
  </div>

  <div class="chat-shell">
    <div class="chat-panel">
      <button class="signout" id="signout-btn">Гарах</button>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <input id="msg-input" type="text" placeholder="Мессежээ бичээрэй…" />
        <button id="send-btn">Илгээх</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js?v=2"></script>
 <script src="js/chat.js"></script>
</body>
</html>
